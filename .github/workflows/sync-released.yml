name: Sync released repos

# Publish-out sync: regenerate the released split repos from this monorepo
# (scripts/release/released.yml + scripts/release/sync_released.py).
#
# Manual dispatch, defaulting to a dry run. A real sync (dry_run=false) overwrites
# each released repo's managed paths, publishes one shared semantic-version tag,
# and advances the baseline — one dispatch drives it all the way through. A
# completed real sync increments the minor version. The uncoordinated-commit
# guard skips any released repo whose `main` has
# moved off the baseline, so out-of-band commits are never clobbered. Needs the
# `RELEASED_SYNC_PAT` and `RELEASED_SYNC_PAT_2` secrets (Contents and Workflows:
# read/write on the released repos; Workflows is required for managed CI files.
# The set is split across two fine-grained tokens because one token caps its
# selected-repository list — the sync routes per repo).

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print planned changes; do not push)"
        type: boolean
        default: true
      only:
        description: "Optional repository short name (for staged first publishes)"
        type: string
        required: false
        default: ""
      force:
        description: "Override a reconciled uncoordinated-commit guard"
        type: boolean
        default: false

concurrency:
  group: sync-released
  cancel-in-progress: false

# `main` is protected, so the advanced baseline is kept on a dedicated,
# unprotected `release-sync-baseline` branch that this job pushes to with the
# built-in token. One dispatch drives the whole publish end to end.
permissions:
  contents: write

env:
  BASELINE_BRANCH: release-sync-baseline

jobs:
  # Stage exactly what this run would publish, then build a fresh downstream
  # project against it on each platform before anything is pushed. See
  # scripts/release/consumer_check.py and SPEC/CI.md §Release consumer check.
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install --user pyyaml
      - name: Load live baseline
        run: |
          if git fetch origin "$BASELINE_BRANCH" 2>/dev/null; then
            git show "origin/$BASELINE_BRANCH:synced.json" > /tmp/baseline.json
          else
            cp scripts/release/synced.json /tmp/baseline.json
          fi
      - name: Stage the repositories this run would publish
        run: |
          python3 scripts/release/sync_released.py --dry-run \
            --baseline /tmp/baseline.json --stage "$RUNNER_TEMP/stage"
          tar -C "$RUNNER_TEMP" -cf "$RUNNER_TEMP/stage.tar" stage
      - uses: actions/upload-artifact@v4
        with:
          name: release-stage
          path: ${{ runner.temp }}/stage.tar
          retention-days: 7

  consumer:
    needs: stage
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Windows reports without blocking the publish until the published FFI
    # builds support it; make it required by deleting this line.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    steps:
      # Sparse: some history file names (e.g. under progress/) contain `:`,
      # which Windows cannot check out, and the check needs only these paths.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/release
            Examples
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml
      - uses: actions/download-artifact@v4
        with:
          name: release-stage
          path: ${{ runner.temp }}
      - name: Unpack stage
        shell: bash
        run: tar -C "$RUNNER_TEMP" -xf "$RUNNER_TEMP/stage.tar"
      - name: Install elan
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            curl -sSfL -o elan-init.ps1 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.ps1
            powershell -ExecutionPolicy Bypass -File elan-init.ps1 -NoPrompt 1 -DefaultToolchain none
            echo "$USERPROFILE/.elan/bin" >> "$GITHUB_PATH"
          else
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
              | sh -s -- -y --default-toolchain none
            echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          fi
      - name: Build a downstream project against the stage
        shell: bash
        run: python scripts/release/consumer_check.py "$RUNNER_TEMP/stage"

  sync:
    needs: consumer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install --user pyyaml
      - name: Load live baseline
        # From the dedicated branch if it exists; otherwise seed from the
        # committed scripts/release/synced.json (first run / bootstrap).
        run: |
          if git fetch origin "$BASELINE_BRANCH" 2>/dev/null; then
            git show "origin/$BASELINE_BRANCH:synced.json" > /tmp/baseline.json
          else
            cp scripts/release/synced.json /tmp/baseline.json
          fi
      - name: Sync released repos
        env:
          RELEASED_SYNC_PAT: ${{ secrets.RELEASED_SYNC_PAT }}
          RELEASED_SYNC_PAT_2: ${{ secrets.RELEASED_SYNC_PAT_2 }}
        run: |
          args=()
          [ "${{ inputs.dry_run }}" = "false" ] || args+=(--dry-run)
          [ -z "${{ inputs.only }}" ] || args+=(--only "${{ inputs.only }}")
          [ "${{ inputs.force }}" = "true" ] && args+=(--force)
          python3 scripts/release/sync_released.py \
            --baseline /tmp/baseline.json "${args[@]}"
      - name: Publish advanced baseline
        # A later mirror can fail after earlier mirrors were pushed. Preserve
        # their heads and the pending shared version so a retry resumes it.
        if: ${{ always() && inputs.dry_run == false }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f /tmp/baseline.json ]; then
            echo "::warning::No baseline file was produced; nothing to publish."
            exit 0
          fi
          work=$(mktemp -d); cd "$work"
          git init -q -b "$BASELINE_BRANCH"
          cp /tmp/baseline.json synced.json
          git add synced.json
          git -c user.name="hex-dev sync" -c user.email="noreply@anthropic.com" \
            commit -q -m "chore: sync baseline @ ${GITHUB_SHA:0:12}"
          git push -q -f \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "$BASELINE_BRANCH"
          echo "::notice::Advanced baseline pushed to $BASELINE_BRANCH."
