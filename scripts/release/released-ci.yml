              key: lake-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'conformance/lean-toolchain', 'conformance/lake-manifest.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
              restore-keys: |
                lake-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'conformance/lean-toolchain', 'conformance/lake-manifest.json') }}-
          - name: Fetch Mathlib cache
            run: lake exe cache get
          - name: Build bridge (Mathlib must come from cache, never rebuild)
            run: |
              set -o pipefail
              lake build HexPrimalityMathlib 2>&1 | tee build.log
              if grep -qE 'Building Mathlib\b' build.log; then
                echo "ERROR: Mathlib rebuilt from source (cache miss)"; exit 1; fi
          - name: Fetch Mathlib cache for correspondence conformance
            run: |
              cd conformance
              lake exe cache get
          - name: Build correspondence conformance
            run: |
              cd conformance
              set -o pipefail
              lake build HexPrimalityMathlibConformance 2>&1 | tee build.log
              if grep -qE 'Building Mathlib\b' build.log; then
                echo "ERROR: Mathlib rebuilt from source (cache miss)"; exit 1; fi
          - name: Save Lake build outputs
