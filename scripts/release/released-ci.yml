          - name: Build library and release regressions
            run: lake build HexPolyFp
          - name: Build conformance sidecar
            run: |
              cd conformance
              lake build
          - name: Conformance oracle
            run: |
              (cd conformance && lake exe hexpolyfp_emit_fixtures) > /tmp/hex-poly-fp-fresh.jsonl
              diff -u conformance-fixtures/HexPolyFp/poly.jsonl /tmp/hex-poly-fp-fresh.jsonl
              python3 scripts/oracle/polyfp_flint.py < /tmp/hex-poly-fp-fresh.jsonl
          - name: Build and verify benchmarks
            env:
              BENCH_VERIFY_HARD_CAP_SECONDS: "360"
