# Centrally managed released-mirror CI workflows.
#
# Each value is the complete .github/workflows/ci.yml published to the named
# repository by sync_released.py. A mirror ships only its library, so its
# workflow only builds that library: one ubuntu job that restores the Lake
# cache, builds the published targets, and saves the cache from main.
# Benchmarks, conformance drivers, fixtures and oracles live in hex-dev and run
# in hex-dev's CI. The sync's divergence guard protects this artifact exactly
# like every other managed path.
workflows:
  hex-basic: |
    name: CI
    on:
      push:
        branches: [main]
      pull_request:
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    jobs:
      build:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v4
          - uses: leanprover/lean-action@v1
            with:
              auto-config: false
              build: false
              use-github-cache: false
              use-mathlib-cache: false
          - name: Restore Lake build outputs
            uses: actions/cache/restore@v4
            with:
              path: |
                .lake/build
                .lake/packages/Hex*/.lake/build
              key: lake-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
              restore-keys: |
                lake-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
          - name: Build library
            run: lake build
          - name: Assert Mathlib-free
            run: |
              if find .lake -type d -iname mathlib 2>/dev/null | grep -q .; then
                echo "ERROR: a Lake build pulled in Mathlib"; exit 1; fi
              if grep -rqE '^[[:space:]]*((public|private|meta)[[:space:]]+)*import[[:space:]]+Mathlib' HexBasic 2>/dev/null; then
                echo "ERROR: a source file imports Mathlib"; exit 1; fi
              echo "Mathlib-free OK"
          - name: Save Lake build outputs
            if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
            uses: actions/cache/save@v4
            with:
              path: |
                .lake/build
                .lake/packages/Hex*/.lake/build
              key: lake-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.run_id }}-${{ github.run_attempt }}

