# Publish-out sync manifest.
#
# `hex-dev` is the source of truth. The sync (scripts/release/sync_released.py,
# driven by .github/workflows/sync-released.yml) regenerates each released repo
# from this monorepo: it deletes everything outside the repo's *managed* paths
# and its unmanaged skeleton, overwrites the managed paths from here, enables
# native Verso docstrings in each managed-source repo's lakefile, copies the
# monorepo's Lean toolchain, synchronizes exact external dependency locks,
# rewrites cross-repo Hex pins to the commits just synced, and commits to the
# released repo's `main`.
#
# A released repo ships the library and nothing else: its Lean source, umbrella,
# SPEC and README. Benchmarks, conformance drivers, fixtures and oracles are
# development instruments that only make sense against the whole graph, so they
# live here and run in this monorepo's CI; a mirror's own CI builds what it
# publishes, which is what its users consume.
#
# That is a property of the driver, not of this file. `allowed_paths` in
# sync_released.py computes what a mirror may contain -- the entry's managed
# paths, the managed .github/workflows/ci.yml, and the skeleton the sync does
# not author (root Lake files, lake-manifest.json, lean-toolchain, LICENSE,
# .gitignore, AGENTS.md) -- and `prune_unmanaged` deletes the rest. A new entry
# therefore inherits the whole policy, and there is nothing per-entry to
# remember. Nothing else under .github/ survives, so a mirror cannot accumulate
# a second workflow beside its build-only one; nor do `reports/` or `.claude/`,
# beyond the figures an entry names below.
#
# Order is topological (upstream first) so each repo's freshly-pushed SHA is
# known before its downstream consumers are processed.
#
# ADDING A REPO HERE IS ONLY HALF THE JOB. Each publishing token is scoped to
# an explicit list of repositories (and a fine-grained token caps that list,
# so there is more than one), so the new repo must also be added to one of the
# `hex-publishing` / `hex-publishing-2` fine-grained tokens and approved by an
# organization owner before the sync can push to it. Any token with room
# works; the sync routes per repo. See PLAN/Releases.md
# §"Publishing a new library: widen a token first"; sync_released.py
# preflights this and refuses to start if it was missed.
#
# Per-repo managed path conventions (resolved by the driver):
#   <Lib>/    (minus <Lib>/SPEC/ and <Lib>/README.md)  -> <Lib>/
#   <Lib>/README.md   (unless readme: false)  -> README.md
#   <Lib>.lean        (if umbrella: true)   -> <Lib>.lean
#   <Lib>/SPEC/<spec>.md                    -> SPEC/<spec>.md
#   extra_paths entries                      -> their explicit destinations
#   scripts/release/released-ci.yml[<repo>]  -> .github/workflows/ci.yml
# The CI workflow is generated for every entry, including `pins_only`; it builds
# the library and nothing else, and the driver applies the same divergence guard
# as every other managed path.
# `test_modules` lists verification-only modules copied with the source but
# intentionally absent from the public umbrella; released CI builds them via a
# non-public `lean_lib` target.
# `keep_paths` is the escape hatch out of that sweep: explicit relative paths a
# mirror owns that are neither managed nor part of the common skeleton. One
# entry uses it, for `hex-test-kit`'s fixed `HexTestKit.lean` umbrella. It can
# only preserve, so a forgotten entry surfaces as a deletion in the dry run, not
# as an over-published mirror; it may not name a development instrument.
# `build_modules` lists complete development umbrellas that the released Lake
# skeleton must build separately from the curated public umbrella.
# `executables` maps an unmanaged released executable name to its mathematical
# root module. The sync refuses to publish when the skeleton is stale.
# `pins` lists the upstream repos whose git rev is rewritten in this repo's root
# lakefile (matched by their github URL); `lakefile` is that file's format.
# The mirror's `lean_lib` build settings are deliberately *not* recorded here:
# this monorepo's `lakefile.lean` is the source of truth for how a library is
# built, so the sync reads the `lean_lib <lib>` block and carries the settings
# across itself, writing `precompileModules` into the mirror when it is missing
# and refusing to publish when a setting it cannot synthesize has gone. A second
# copy of a build decision in this manifest only gives it somewhere to drift.
# `announcements` maps a venue (`blog`, `zulip`, `linkedin`) to the https URL
# where this library was announced; it renders as one line per library in the
# aggregate README's Announcements section. Deliberately not a table column:
# only a couple of libraries are ever announced, so a column would be empty for
# almost every row.
# `component` is the human label this library gets in the aggregate README's
# table (see `readme_template` below). Required on every aggregated
# computational library, so releasing one cannot silently skip the table; the
# `*-mathlib` companions need none, they occupy the table's third column.
#
# A `pins_only: true` entry (the leanprover/hex aggregate) manages no library
# source from the monorepo: its umbrella lakefile and umbrella .lean live only
# in the released repo, and the sync re-pins it to the SHAs published this run.
# Its `readme_template` is rendered by scripts/release/aggregate_readme.py and
# published as the repo's README.md. Such an entry is listed last so every
# upstream it pins is already synced.

repos:
  - repo: leanprover/hex-basic
    component: Foundations
    lib: HexBasic
    umbrella: true
    readme: false        # README is authored in the released repo, not managed
    spec: null
    pins: []
    lakefile: toml

  - repo: leanprover/hex-test-kit
    lib: Hex
    aggregate: false          # test/conformance helper, not user-facing Hex API
    umbrella: false        # released HexTestKit.lean umbrella is fixed
    paths:                 # explicit: only the shared helper source
      - { src: "Hex", dest: "Hex" }
    spec: null
    keep_paths: [HexTestKit.lean]   # mirror-local umbrella, authored there
    pins: []
    lakefile: toml

