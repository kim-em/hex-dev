  # `HexGraph` supplies dense and sparse graph representations with no SPEC surface of its
  # own, and `hex-graph-iso` is its only consumer, so it rides into this
  # repository through `extra_paths` rather than becoming a repository, a CI
  # workflow, a token slot and an aggregate-README row of its own. The generated
  # Lake file declares `lean_lib HexGraph` beside `lean_lib HexGraphIso`,
  # as the monorepo lakefile does. A second consumer of `HexGraph` is the
  # trigger to promote it to `leanprover/hex-graph`; the source must not be
  # duplicated across two mirrors.
  #
  # The pins are the published part of the closure `HexGraphIso` reaches:
  # `HexBasic` directly, `HexMatrix` through `HexGraph.Basic`, and
  # `HexPermGroup` through sparse relabelling and automorphism operations. The
  # vendored nauty source and both nauty comparators -- the shim behind
  # `scripts/oracle/graphiso_nauty.py` and the in-process
  # `Hex.BenchOracle.Nauty` binding -- stay in this monorepo with every other
  # development instrument, so no pin here can drag `vendor/nauty-2.9.3` into
  # the mirror and `leanprover/nauty-ffi` never becomes a dependency of the
  # shipped library.
  - repo: leanprover/hex-graph-iso
    component: Graph canonical labelling
    announcements:
      blog: https://kim-em.github.io/blog/2026-9-5-certified-graph-isomorphism-in-lean/
      zulip: https://leanprover.zulipchat.com/#narrow/channel/579630-Project-announcements/topic/Hex.3A.20graph.20isomorphism.20via.20a.20formalization.20of.20.60nauty.60/near/621968237
    lib: HexGraphIso
    test_modules: [HexGraphIso.TestGraphs, HexGraphIso.TacticTests,
      HexGraphIso.ModuleBoundaryTests, HexGraphIso.SparseTests]
    umbrella: true
    spec: hex-graph-iso
    extra_paths:
      - { src: "HexGraph", dest: "HexGraph" }
      - { src: "HexGraph.lean", dest: "HexGraph.lean" }
    pins: [hex-basic, hex-matrix, hex-perm-group]
    lakefile: toml

  - repo: leanprover/hex-graph-iso-theory
    lib: HexGraphIsoTheory
    test_modules: [HexGraphIsoTheory.TacticTests, HexGraphIsoTheory.SparseTacticTests]
    umbrella: true
    spec: hex-graph-iso-theory
    pins: [hex-basic, hex-matrix, hex-perm-group, hex-perm-group-theory, hex-graph-iso]
    lakefile: toml

