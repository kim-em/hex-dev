  # `HexGraph` is a one-file graph representation with no SPEC surface of its
  # own, and `hex-graph-iso` is its only consumer, so it rides into this
  # repository through `extra_paths` rather than becoming a repository, a CI
  # workflow, a token slot and an aggregate-README row of its own. The released
  # skeleton declares `lean_lib HexGraph` beside `lean_lib HexGraphIso`,
  # mirroring the monorepo lakefile. A second consumer of `HexGraph` is the
  # trigger to promote it to `leanprover/hex-graph`; the source must not be
  # duplicated across two mirrors.
  #
  # The pins are the published part of the closure `HexGraphIso` reaches:
  # `HexBasic` directly, and `HexMatrix` through `HexGraph.Basic`. The
  # vendored nauty source and both nauty comparators -- the shim behind
  # `scripts/oracle/graphiso_nauty.py` and the in-process
  # `Hex.BenchOracle.Nauty` binding -- stay in this monorepo with every other
  # development instrument, so no pin here can drag `vendor/nauty-2.9.3` into
  # the mirror and `leanprover/nauty-ffi` never becomes a dependency of the
  # shipped library.
  - repo: leanprover/hex-graph-iso
    component: Graph canonical labelling
    lib: HexGraphIso
    test_modules: [HexGraphIso.TacticTests, HexGraphIso.ModuleBoundaryTests]
    umbrella: true
    spec: hex-graph-iso
    extra_paths:
      - { src: "HexGraph", dest: "HexGraph" }
      - { src: "HexGraph.lean", dest: "HexGraph.lean" }
    pins: [hex-basic, hex-matrix]
    lakefile: toml

