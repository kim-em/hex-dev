    umbrella: true
    spec: hex-arith
    pins: []
    lakefile: lean
    lake_declarations: [hexArithOTarget, hexarithWideO, hexarithGcdO, HexArithNative]
    extra_paths:
      - { src: "HexArithNative.lean", dest: "HexArithNative.lean" }

  - repo: leanprover/hex-modular
