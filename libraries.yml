      input_families:
        - name: seeded-dense
          description: Seed-0xC0FFEE bounded-coefficient dense polynomials and their bounded-height (X−1) product; drives parametric mahlerPrec and canonical Taylor, witness, Newton, and pinned-NK regressions.
        - name: fixed-separation-product
          description: Products ∏(2X−(2j+1)) with uniformly separated half-integer roots; drives canonical fixed isolate/isolateAll/refine1 regressions and the historical unregistered isolation diagnostic ladder.
        - name: wilkinson-linprod
          description: The canonical degree-10 product ∏(X−j), with roots 1..10; shared by the three fixed dual-route strategy regressions.
        - name: refine-fixed
          description: The degree-3 polynomial (x−1)(x−2)(x+3), used by parametric refineTo on its achieved-precision ladder and by fixed sameRoot.
