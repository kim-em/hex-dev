# libraries.yml — per-library structure + state.
#
# Structural fields (deps, mathlib) change rarely, only when the library
# graph changes. State fields (done_through, status) change as libraries
# advance through phases or are activated/deactivated.
#
# Semantics:
# - done_through: K means phases 1..K are all complete for L (linear,
#   no skipping — enforced by the phase-dep table in PLAN/README.md).
# - done_through: 0 means no per-library phases are complete; L is
#   ready to start Phase 1 once Phase 0's global bootstrap is done.
# - done_through: 7 means L is fully done.
# - status: active | planned | draft (see PLAN/Conventions.md
#   §"Library status (active | planned | draft)" for the full
#   semantic contract).
#     - active: orchestrator dispatches Phase work.
#     - planned: SPEC ready, implementation deferred. Lake-alignment
#       and root-file checks waived. Listed in status report footer.
#       Required: done_through == 0.
#     - draft: SPEC incomplete. Same orchestration treatment as planned.
#       Required: done_through == 0.
#   Active libraries depend only on active libraries (load-time invariant).
# - correspondence_only (optional, default false): explicit classification for
#   a mathlib bridge that owns no conformance, compiled benchmark, or
#   proof-probe surface. Flagged libraries declare their computational
#   conformance and performance owners in their per-library SPEC.
# - Phase 0 (monorepo bootstrap) is global; its completion is observable
#   by the existence of lakefile.lean, scripts/check_dag.py, etc., not
#   by any field in this file.
# - phase4 (optional, for active libraries planning to reach
#   done_through ≥ 4): structured Phase-4 metadata that mechanical
#   checks read. SPEC text in SPEC/Libraries/<lib>.md carries the
#   narrative; this block carries the machine-readable form.
#     - phase4.comparators: list of named external comparators.
#       Each entry has:
#         tool: <string>          # human-readable tool identifier
#         class: gating | informational
#         goal: <string>          # required when class == gating;
#                                 # the performance goal the headline
#                                 # report measures against this
#                                 # comparator (e.g. "at least as
#                                 # fast as X on shared inputs").
#         rationale: <string>     # required when class == informational;
#                                 # why this comparator does not gate.
#       See SPEC/benchmarking.md §"Comparator classification" and
#       §"Comparator naming".
#     - phase4.input_families: list of named non-degenerate input
#       families the per-library SPEC requires Phase-4 benchmarking
#       to exercise. Each entry has:
#         name: <string>          # short identifier used in profile
#                                 # subsection headings
#         description: <string>   # one-line description matching the
#                                 # per-library SPEC's narrative
#       See SPEC/benchmarking.md §"Anti-patterns" entry on best-case
#       inputs and SPEC/profiling.md §"Coverage requirement".
# - proof_probes (optional): explicit repository-relative paths below
#   bench/<Library>/ containing build-only proof-elaboration or kernel-replay
#   probes. Mathlib-free libraries may declare probes, but only mathlib: true
#   owners receive an exception for Mathlib imports. Files elsewhere in the
#   same bench/<Library>/ tree remain ordinary computational-bench sources. A
#   path
#   may reserve a not-yet-created directory for a later stacked change; once
#   present it must be a directory resolving physically inside bench/ and its
#   subtree must contain no symlinks. A done_through: 4 library may not retain
#   a missing or empty reservation.
#
# This file is the single source of truth for the library graph.
# lakefile.lean entries are cross-checked against active libraries.yml
# entries in CI via scripts/check_dag.py.

libraries:

  # ---------- Roots ----------
  HexBasic:
    deps: []
    mathlib: false
    done_through: 7
    status: active
  HexTruncatedSeries:
    deps: [HexBasic]
    mathlib: false
    done_through: 7
    status: active
    phase4:
      comparators:
        - tool: FLINT fmpq_poly truncated series routines via python-flint
          class: informational
          rationale: "FLINT's series routines run on tuned coefficient-specific Karatsuba/Toom-Cook/FFT multiplication while this library uses a semiring-generic schoolbook kernel, so the measured ratio includes a known kernel gap rather than only the Newton iterations."
      input_families:
        - name: multiplication
          description: truncated products at precisions 8 to 4096 over Int and Rat
        - name: inverse
          description: Newton inversion against the linear recurrence on the same ladder
        - name: exp-log
          description: exp and log at precisions 8 to 1024 over Rat
        - name: sqrt
          description: square root at a supplied constant root over Rat
        - name: composition
          description: Horner against Brent-Kung at precisions 8 to 512
        - name: reversion
          description: Newton reversion against Lagrange inversion over Rat
  HexArith:
    deps: []
    mathlib: false
    done_through: 7
    status: active
    phase4:
      input_families:
        - name: modular-multiplication-chain
          description: Repeated Barrett and Montgomery UInt64 modular multiplication over the shared small odd modulus 65537.
        - name: word-powmod
          description: Public modular exponentiation over a fixed odd word-sized modulus with deterministic exponents varying by bit length.
        - name: bounded-word-extgcd
          description: Batched Nat, Int/GMP, and UInt64 extended-GCD calls on deterministic nonnegative bounded-word sample pairs.
  HexPoly:
    deps: []
    mathlib: false
    done_through: 4
    status: active
    phase4:
      comparators:
        - tool: "FLINT fmpz_poly via python-flint"
          class: informational
          rationale: "FLINT tunes Karatsuba/Toom-Cook/FFT crossovers in fmpz_poly_mul and other specialized integer-polynomial kernels, while HexPoly deliberately supplies the schoolbook semantic foundation and delegates faster algorithms to downstream libraries. Ratios are recorded for orientation rather than as Phase-4 gates. Wired via a warmed persistent-subprocess Python driver per SPEC/benchmarking.md §External comparators §Process call."
      input_families:
        - name: dense-int-arithmetic
          description: Deterministic dense integer polynomials for coefficientwise arithmetic, multiplication, derivative, and composition.
        - name: field-euclidean
          description: Fixed-size F7 dense polynomials for division, monic remainder, gcd, and extended gcd.
        - name: integer-content
          description: Dense integer polynomials with nontrivial coefficient content for content and primitive-part operations.
        - name: polynomial-crt
          description: Coprime monic rational-polynomial moduli and residues for CRT witness construction.
  HexPolyFast:
    deps: [HexPoly, HexTruncatedSeries]
    mathlib: false
    done_through: 4
    status: active
    phase4:
      comparators:
        - tool: FLINT fmpz_poly and nmod_poly via python-flint
          class: informational
          rationale: "FLINT has independently tuned coefficient-specific dispatch; within-Lean agreement and crossover cells gate production selection."
      input_families:
        - name: full-and-clipped-multiplication
          description: Balanced and unbalanced full, square, low, and middle products across crossover sizes.
        - name: newton-division
          description: One-shot and cached-divisor division against long division.
        - name: half-gcd
          description: Gcd, full xgcd, and one-sided xgcd across balanced and skewed degree pairs.
        - name: multipoint
          description: Cold and reused product/remainder trees for evaluation and interpolation.
        - name: pade
          description: Homogeneous and normalized Padé cases, including normalized failure.
        - name: coefficient-kernels
          description: Forced Kronecker and direct/CRT-NTT paths across degree, width, and modulus ladders.
  HexMvPoly:
    deps: [HexPoly, HexBasic]
    mathlib: false
    done_through: 4
    status: active
    phase4:
      comparators:
        - tool: "CompPoly CMvPolynomial"
          class: informational
          rationale: "CompPoly uses the same ExtTreeMap representation behind a Mathlib-dependent API; the comparison records integration and implementation overhead rather than gating release."
        - tool: "canonical sorted-list MvSparsePoly proxy"
          class: informational
          rationale: "The pinned Mathlib revision has no MvSparsePoly, so a local canonical sorted-list proxy records compiled throughput for the alternative algorithmic shape. The native comparison is informational; only the registered kernel proof probes can decide whether a second representation is justified."
      input_families:
        - name: sparse-addition
          description: Disjoint and interleaved sparse supports across lexicographic, graded lexicographic, and graded reverse lexicographic order.
        - name: sparse-multiplication
          description: Low-collision and high-collision products varying arity, degree, term count, coefficient type, and comparator.
        - name: cancellation-arithmetic
          description: Cancellation-heavy integer and rational arithmetic measured as compiled Mathlib-free computation.
        - name: structural-collisions
          description: Sparse rename, partial-evaluation, and substitution cases where distinct source terms collide.
        - name: sum-of-squares-arithmetic
          description: Representative sum-of-squares-shaped identities measured as compiled Mathlib-free arithmetic.
  HexMvGcd:
    deps: [HexBasic, HexMvPoly, HexPoly, HexPolyFp, HexResultant, HexArith, HexModArith, HexModular, HexPolyZGcd]
    mathlib: false
    done_through: 3
    status: active
    phase4:
      comparators:
        - tool: FLINT fmpz_mpoly and fmpq_mpoly via python-flint
          class: informational
          rationale: The matched driver covers integer and rational GCD, exact division, and squarefree decomposition, but its coprime endpoints exercise Hex's one-step-remainder prepass rather than the modular route; FLINT also dispatches to Zippel and sparse Hensel routes outside this SPEC, so the rows are semantic and process-protocol anchors rather than meaningful Phase-4 ceilings.
        - tool: Singular gcd, quotient, and factorize
          class: informational
          rationale: The persistent driver covers all seven families, but the coprime endpoints exercise Hex's one-step-remainder prepass rather than the modular route and Singular has sparse routes outside this SPEC; its ratios diagnose representation and protocol coverage rather than supply Phase-4 ceilings.
      input_families:
        - name: coprime-pairs
          description: Dense and sparse coprime inputs in 2 to 8 variables, isolating the modular coprimality route.
        - name: dense-gcds
          description: Dense inputs in 3 to 5 variables with degree 5 to 20 in each variable, isolating Brown interpolation.
        - name: sparse-stress
          description: High-degree, few-term inputs in 5 to 12 variables recording the known absence of a sparse route.
        - name: swell
          description: Small inputs whose extended subresultant remainder sequence develops large coefficients.
        - name: rational
          description: Integer-family shapes over rationals, exercising denominator clearing and integer lifting.
        - name: squarefree
          description: Multiplicity patterns 1, 1-through-5, 7, and 2-3-5-7 in 2 to 5 variables.
        - name: cofactor-heavy
          description: Small gcds with large cofactors, isolating checked multivariate exact division.
  HexSparsePoly:
    deps: [HexPoly, HexBasic]
    mathlib: false
    done_through: 7
    status: active
    phase4:
      comparators:
        - tool: SymPy sparse ring elements (sympy.polys.rings)
          class: informational
          rationale: "SymPy is the conformance oracle and is Python, so the ratio is reported for context and does not determine acceptance."
        - tool: FLINT fmpz_poly via python-flint
          class: informational
          rationale: "fmpz_poly is dense, so above the crossover the comparison measures the choice of representation rather than the quality of either implementation. Recorded on the crossover family only."
      input_families:
        - name: sparse-arithmetic
          description: addition and multiplication of 2 to 64 term inputs at degrees 10^3 to 10^6
        - name: sparse-multiplication
          description: low-collision and high-collision products across the three candidate implementations
        - name: crossover
          description: the same operations against DensePoly with the term count swept from 2 to the degree, locating one crossover per operation
        - name: evaluation
          description: gap Horner against dense Horner across the same sweep
        - name: substitution-power
          description: substPow on the cyclotomic shapes against the dense route
        - name: convert-gcd
          description: gcd and divMod through the conversions on the sparse-remainder x^n-1 pair and on generic sparse pairs, recording the conversion share separately
  HexMatrix:
    deps: [HexBasic]
    mathlib: false
    done_through: 7
    status: active
    phase4:
      input_families:
        - name: dense-square-multiplication
          description: Deterministic dense square integer matrices for textbook cubic matrix multiplication.
        - name: strassen-crossover-scaling
          description: Deterministic dense square integer matrices swept over dimension n and Strassen cutoff tau, for the naive-vs-mulStrassen log-log scaling figure and the measured crossover cutoff shipped as strassenDefault.cutoff.
  HexRowReduce:
    deps: [HexMatrix]
    mathlib: false
    done_through: 4
    status: active
    phase4:
      comparators:
        - tool: "FLINT fmpq_mat.rref rank via python-flint"
          class: informational
          rationale: "The rank result is identical and constant-size, so cached dense inputs permit a valid persistent-subprocess comparison. Full rowReduce is not paired because Hex additionally returns the row transform; nullspace and span witnesses have no native identical callable result in python-flint."
      input_families:
        - name: dense-rational-rref
          description: Dense square rational I + J matrices with a pivot in every column and nonzero elimination above and below every pivot, plus a known row-span member.
        - name: rank-deficient-rational-nullspace
          description: Rank-and-nullity n / 2 rational matrices, using repeated I + J for public wrappers and an already-reduced sparse projection to isolate free columns, echelon coefficients, and contract-level nullspace construction.
  HexDeterminant:
    deps: [HexMatrix]
    mathlib: false
    done_through: 7
    status: active
    phase4:
      input_families:
        - name: leibniz-small-determinant
          description: Small structured integer matrices where the generic Leibniz determinant remains practical, cross-checked against the row-pivoted Bareiss determinant.
  HexBareiss:
    deps: [HexArith, HexDeterminant, HexMatrix]
    mathlib: false
    done_through: 4
    status: active
    phase4:
      comparators:
        - tool: "FLINT fmpz_mat_det via python-flint"
          class: informational
          rationale: "FLINT's fmpz_mat_det uses multimodular reduction (determinant modulo many small primes, then CRT), which has a different asymptotic and constant-factor profile from the Hex row-pivoted Bareiss fraction-free elimination over Int. The ratio is recorded for orientation but is not a Phase-4 gate. Wired via a persistent-subprocess Python driver per SPEC/benchmarking.md §External comparators §Process call."
      input_families:
        - name: structured-bareiss-determinant
          description: Deterministic tridiagonal integer matrices for row-pivoted Bareiss determinant scaling without arbitrary coefficient blow-up.
  HexCharPoly:
    deps: [HexMatrix, HexPoly]
    mathlib: false
    done_through: 0
    status: active
  HexMinPoly:
    deps: [HexMatrix, HexRowReduce, HexPoly]
    mathlib: false
    done_through: 0
    status: active
    phase4:
      comparators:
        - tool: "FLINT fmpz_mat_minpoly and fmpq_mat.minpoly via python-flint"
          class: informational
          rationale: "FLINT uses a small-vector candidate-and-annihilation strategy rather than Hex's deterministic basis sweep with a minimality certificate. The ratio is useful orientation but does not gate the verified algorithm. Wired through the shared persistent-subprocess Python driver."
        - tool: "PARI minpoly via cypari2"
          class: informational
          rationale: "PARI's matrix minimal-polynomial implementation is algorithmically independent of Hex's certificate-producing basis sweep, so its ratio is recorded for orientation rather than used as a release threshold. Wired through the shared persistent-subprocess Python driver."
      input_families:
        - name: random-dense-minpoly
          description: Dense bounded-entry integer matrices read over Rat, usually with full-degree minimal polynomial.
        - name: modular-minpoly
          description: Full-degree companion matrices over a fixed-width prime field, isolating operation count from rational coefficient growth.
        - name: derogatory-minpoly
          description: Repeated nilpotent blocks whose minimal-polynomial degree stays bounded while dimension grows.
        - name: companion-minpoly
          description: Companion matrices with known full-degree minimal polynomials used as an in-benchmark correctness check.
  HexPolySmith:
    deps: [HexPoly, HexMatrix, HexDeterminant]
    mathlib: false
    done_through: 4
    status: active
    phase4:
      comparators:
        - tool: "SymPy smith_normal_form over polynomial domains"
          class: informational
          rationale: "SymPy is a pure-Python conformance oracle and uses a separately tuned algorithm; its ratio provides orientation but does not gate the classical Euclidean pivot implementation."
        - tool: "PARI matsnf on polynomial entries"
          class: informational
          rationale: "PARI's polynomial-entry surface is square-only and does not match the full rectangular API, so it is retained as an informational cross-check."
      input_families:
        - name: dense-polysmith
          description: Dense rational presentations with a controlled dimension chain and a consecutive-remainder degree ladder that exercises the Euclidean kernel with derived boundary growth.
        - name: chain-conjugate-poly
          description: Known monic invariant-factor chains conjugated by deterministic unimodular matrices.
        - name: rational-polysmith
          description: Fixed-denominator dimension chains and a rational consecutive-remainder degree ladder with explicit denominator and transform-bit growth.
        - name: diagonal-polysmith
          description: Unordered diagonal polynomial presentations that exercise block repair across a matrix-dimension ladder.
        - name: small-field-degree
          description: A ZMod64 2 degree ladder at fixed dimension, where evaluation certificates cannot obtain enough distinct field points.
  HexPolySmithMathlib:
    deps: [HexPolySmith, HexPolyMathlib, HexMatrixMathlib]
    mathlib: true
    correspondence_only: true
    done_through: 7
    status: active

  # ---------- Depth 1 ----------
  HexModArith:
    deps: [HexArith]
    mathlib: false
    done_through: 7
    status: active
    phase4:
      input_families:
        - name: word-residue-core
          description: Fixed-word prime-modulus residues for construction, casts, add/sub, extern multiplication, exponentiation, and inverse.
        - name: barrett-hot-loop
          description: Barrett-context multiplication chains over the UInt64 residue wrapper on the shared small odd prime modulus.
        - name: montgomery-hot-loop
          description: Montgomery conversion, Montgomery-form multiplication chains, and conversion back on the shared small odd prime modulus.
  HexModular:
    deps: [HexArith]
    mathlib: false
    done_through: 7
    status: active
    phase4:
      comparators:
        - tool: "gmpy2.gcdext"
          class: informational
          rationale: "gmpy2 exposes GMP's tuned extended GCD, while HexModular reaches the same arithmetic through HexArith's GMP-backed compiled path. The ratio isolates binding and orchestration overhead rather than an algorithm choice, so it is recorded for orientation and does not gate Phase 4."
        - tool: "python-flint fmpz CRT"
          class: informational
          rationale: "python-flint exposes FLINT's fmpz and fmpz_mod_ctx arithmetic for the same incremental Garner recurrence. The ratio chiefly measures Python framing and arithmetic binding costs, not a choice between interchangeable Hex algorithms, and therefore remains informational."
      input_families:
        - name: incremental-crt
          description: Scalar accumulation over 4 to 8192 pairwise-coprime word-size prime-power moduli.
        - name: vector-crt
          description: Fixed-depth width ladders and fixed-width depth ladders that expose reuse of one extended GCD across coordinates.
        - name: rational-reconstruction
          description: Fibonacci-shaped late Euclidean runs through 262144 bits and early-success cases through 100000 bits.
        - name: failure-cost
          description: Full Euclidean runs whose impossible numerator bound forces reconstruction failure through the final checks.
  HexGramSchmidt:
    deps: [HexRowReduce, HexDeterminant, HexBareiss]
    mathlib: false
    done_through: 7
    status: active
    phase4:
      input_families:
        - name: integer-gram-surface
          description: Deterministic n x (2n + 1) integer bases for Gram determinant vectors and scaled-coefficient surfaces.
        - name: row-update-helpers
          description: Deterministic small-entry update fixtures for size reduction and adjacent row swaps.
        - name: adjacent-swap-scalars
          description: Adjacent-swap denominator, pivot coefficient, Gram-determinant quotient, and scaled-coefficient numerator helper formulas.
  HexGF2:
    deps: [HexBasic]
    mathlib: false
    done_through: 4
    status: active
    phase4:
      comparators:
        - tool: "NTL GF2X via persistent C++ subprocess driver"
          class: informational
          rationale: "The measured NTL 11.6.0 build links gf2x 1.3.0; NTL's GF2X source uses tuned base cases and Karatsuba/gf2x multiplication, crossover-based division and remainder, and switches GCD to HalfGCD above its configured crossover, while Hex uses packed schoolbook multiplication, long division and remainder, and Euclidean GCD. Those performance ratios compare different algorithm classes and are informational. Addition is retained only as a same-input correctness/protocol anchor because hex framing dominates its linear kernel. Wired via a warmed persistent-subprocess C++ driver (`scripts/oracle/gf2_ntl_bench_driver.cc`, built on-demand by `scripts/oracle/setup_gf2_ntl_driver.sh`) per SPEC/benchmarking.md §External comparators §Process call."
      input_families:
        - name: packed-word-clmul
          description: Deterministic UInt64 sample pairs for pure-Lean and extern carry-less word multiplication chains.
        - name: packed-bitwise-core
          description: Deterministic same-size packed GF2 polynomials for XOR addition and size-proportional left/right shifts.
        - name: packed-euclidean
          description: Deterministic same-size and division-shape packed GF2 polynomials for schoolbook multiplication, long division, remainder, gcd, and extended gcd.
        - name: gf2n-aes-field
          description: Deterministic AES-modulus single-word extension-field samples for addition, multiplication, inversion, division, and square-and-multiply powering.
        - name: gf2n-poly-quotient
          description: Deterministic degree-128 packed quotient-field samples for multiplication, inversion, division, and square-and-multiply powering.
        - name: packed-vs-generic-comparison
          description: Shared deterministic GF(2) coefficient fixtures for cross-library comparisons of packed `GF2Poly` versus generic `FpPoly 2` polynomial gcd and Berlekamp-style Frobenius-column construction.
  HexPolyZ:
    deps: [HexPoly, HexModArith, HexPolyFast, HexModular, HexArith, HexBasic]
    mathlib: false
    done_through: 7
    status: active
    phase4:
      input_families:
        - name: congruence-witnesses
          description: Dense integer-polynomial finite-prefix congruence and constructed Bezout witness checks modulo a small prime.
        - name: content-normalization
          description: Dense integer polynomials with nontrivial coefficient content for content and primitive-part normalization.
        - name: mignotte-helpers
          description: Central binomial, square-root, coefficient-norm, and Mignotte coefficient-bound helper computations over deterministic integer-polynomial fixtures.
  HexPolyZGcd:
    deps: [HexPolyZ, HexPolyFp, HexPoly, HexModular, HexModArith, HexArith, HexResultant]
    mathlib: false
    done_through: 7
    status: active
    phase4:
      comparators:
        - tool: FLINT fmpz_poly_gcd via python-flint
          class: gating
          goal: within 5x on the dense and coprime families above degree 32
      input_families:
        - name: coprime-pairs
          description: Coprime inputs at degrees 8 to 512, where route 1 must settle the result.
        - name: dense-gcds
          description: Gcds of about half the input degree at 8-bit and 256-bit coefficients.
        - name: swell
          description: Small inputs whose subresultant sequence has large coefficients.
        - name: squarefree
          description: The Berlekamp-Zassenhaus squarefree-decomposition ladder.
        - name: rational
          description: The same inputs over the rationals through ratGcd.

  # ---------- Depth 2 ----------
  HexGraphIso:
    deps: [HexBasic, HexMatrix]
    mathlib: false
    done_through: 7
    status: active
    proof_probes: [bench/HexGraphIso/ProofProbe]
    phase4:
      comparators:
        - tool: "nauty 2.9.3 (vendored source, in-process FFI through Hex.BenchOracle.Nauty)"
          class: gating
          goal: "Exact agreement of the canonical upper-triangle bits on every joined instance; conformance pins the visited-node counters, so both programs traverse the same search tree and every timing difference is a per-node constant factor rather than an algorithmic one. Per HexGraphIso/SPEC/hex-graph-iso.md §Benchmarks the first release sets no speed-ratio requirement, so the gating condition is result agreement and the measured ratio is reported without a threshold."
      input_families:
        - name: circulant-ladder
          description: Deterministic coloured circulants on the {1, 2} and {1, 2, 4, 8} offset sets, carrying the four parametrised scientific registrations and the fixed public-operation and certificate sizes.
        - name: random-gnp
          description: G(n, 1/2) graphs of the recorded SplitMix64 corpus seeds, their Fisher-Yates relabellings, and the derived positive and negative decision pairs.
        - name: strongly-regular
          description: Paley, Latin-square, Johnson and Kneser graphs, refinement's hard cases, including the classic (25, 12, 5, 6) negative pair at shared parameters.
        - name: grid-and-hypercube
          description: Grids and hypercubes, the sparse families on which refinement discretizes quickly.
        - name: decision-pairs
          description: Positive and negative isomorphism pairs spanning cycle splittings, irregular cross-family negatives, and same-degree vertex-transitive negatives, carrying the two decision tiers and the kernel-checked tactic tier.
  HexGraphIsoMathlib:
    deps: [HexGraphIso]
    mathlib: true
    done_through: 7
    status: active
    proof_probes: [bench/HexGraphIsoMathlib/ProofProbe]
    phase4:
      input_families:
        - name: cross-type-goals
          description: Generalized Petersen against Kneser at (5, 2) on genuinely different vertex types, and the same-family negative against the pentagonal prism, at n = 10.
        - name: random-pair-transport
          description: The recorded random n = 12 positive and negative pairs carried across the bridge as SimpleGraphs over Fin 12.
  HexHermite:
    deps: [HexRowReduce, HexArith, HexDeterminant]
    mathlib: false
    done_through: 4
    status: active
    phase4:
      comparators:
        - tool: FLINT fmpz_mat_hnf via python-flint
          class: informational
          rationale: FLINT dispatches to asymptotically faster algorithms outside this SPEC
        - tool: PARI mathnf via cypari2
          class: informational
          rationale: PARI is column-style and the timing includes convention conversion
      input_families:
        - name: random-dense-hermite
          description: dense square nonsingular integer matrices with uniformly bounded entries
        - name: rank-deficient-hermite
          description: rows drawn as integer combinations of a smaller independent set
        - name: tall-hermite
          description: tall matrices with many redundant row generators
        - name: unimodular-conjugate
          description: deterministic full unit-triangular factors times a known diagonal form
  HexSmith:
    deps: [HexHermite]
    mathlib: false
    done_through: 7
    status: active
    phase4:
      comparators:
        - tool: FLINT fmpz_mat_snf via python-flint
          class: informational
          rationale: FLINT dispatches to algorithms and crossover policies outside this SPEC
        - tool: PARI matsnf via cypari2
          class: informational
          rationale: PARI uses a separately tuned implementation and is recorded for orientation
      input_families:
        - name: random-dense-smith
          description: dense square nonsingular integer matrices with uniformly bounded entries
        - name: chain-conjugate
          description: known divisibility chains conjugated by random unimodular matrices
        - name: presentation-smith
          description: sparse abelian-group relation matrices run through the dense implementation
  HexLLL:
    deps: [HexGramSchmidt, HexMatrix, HexBasic]
    mathlib: false
    done_through: 7
    status: active
    phase4:
      comparators:
        - tool: "fpLLL via fplll-ffi"
          class: informational
          rationale: "fpLLL uses floating-point Gram-Schmidt (Nguyen-Stehle); this bypasses the integer-arithmetic operand-size drift the verified implementation pays, so the constant-factor gap is structural rather than algorithmic. The ratio is recorded for orientation but does not gate Phase 4. Measured through the fplll-ffi FFI shim (in-process C++ libfplll), the preferred comparator pattern and the same reducer the certified dispatch resolves at runtime, not a Python fpylll subprocess."
        - tool: "verified Isabelle LLL (AFP LLL_Basis_Reduction; Haskell extraction from Zenodo 2636367)"
          class: gating
          goal: "Lean LLL is at least as fast as the verified Isabelle LLL on shared canonical inputs at the bottom of each phase4.input_families parameter ladder."
        - tool: "verified Isabelle certified-LLL (JAR 2020 §7; svp_certified from the Zenodo 2636367 LLL_Basis_Reduction extraction, same archive as the native comparator)"
          class: gating
          goal: "The hex certified path (fpLLL + verified checker) is at least as fast as the Isabelle certified-LLL on shared canonical inputs at the largest eligible rung of each phase4.input_families ladder; the headline report records the ratio, the checker's cost share, and the candidate rejection rate."
      input_families:
        - name: bz-recombination
          description: "Berlekamp-Zassenhaus recombination basis at the documented (p, k, factors) configurations; the downstream hot path."
        - name: random-bounded
          description: "LCG-generated random integer bases, |entry| <= 30, n in {30, 60, 120, 240}; must include a committed seed where >= 1 Lovasz swap fires."
        - name: harsh-cubic
          description: "Entry bit-length ~ 3.3 * n at n in {15, 30, 45} (verified-Isabelle paper regime); exercises bigint operand-size drift."
        - name: ajtai
          description: "Ajtai-style worst-case lower-triangular bases (faithful port of fplll gen_trg / latticegen t, alpha 1.2); diagonal D_i in [2, 2^floor((2d-i)^1.2)], off-diagonals |.| < D_i/2. Drives the Theta(d^2 log B) swap count - the iteration-count scaling axis the near-orthogonal families leave unmeasured."
        - name: q-ary
          description: "q-ary LWE/SIS bases [[I,H],[0,qI]] (fplll gen_qary / latticegen q), H uniform mod q=2^(b-1)+rand; the step profile LLL smooths into the characteristic Z-shape."
        - name: ntru
          description: "NTRU-like bases [[I,Rot(h)],[0,qI]] on 2d x 2d (fplll gen_ntrulike / latticegen n), circulant h with h(1)=0 mod q; planted dense structure plus q-block."
        - name: knapsack
          description: "Rectangular d x (d+1) integer-relation bases (fplll gen_intrel / latticegen r), row i = [rand_b, e_{i+1}]; the only family with cols != rows, exercising the m>n ofBasis path. Also drives the success-vs-density recovery chart."
  HexPolyFp:
    deps: [HexPoly, HexModArith, HexPolyFast, HexModular]
    mathlib: false
    done_through: 3
    status: active
    phase4:
      input_families:
        - name: coefficient-kernels
          description: Balanced `F_257` and `F_65537` operands covering forced schoolbook, packed, Karatsuba, direct-NTT, CRT-NTT, and public-dispatch multiplication routes.
        - name: quotient-powers
          description: Dense `F_65537` quotient-ring exponentiation, fixed-prime Frobenius, and Frobenius-power fixtures with their active modulus degree or exponent height scaled by the parameter.
        - name: modular-composition
          description: Same-size dense `F_65537` Horner modular composition modulo deterministic monic moduli.
        - name: product-squarefree
          description: Deterministic `F_5` products of linear factors covering weighted product reconstruction and Yun square-free decomposition summaries.
        - name: euclidean-division-gcd
          description: Dense long-division inputs and consecutive polynomial-Fibonacci pairs forcing a full decreasing-degree Euclidean remainder chain over `F_65537`.

  # ---------- Finite-field quotient pipeline ----------
  HexGFqRing:
    deps: [HexPolyFp]
    mathlib: false
    done_through: 7
    status: active
    phase4:
      input_families:
        - name: dense-reduction
          description: Dense polynomial reduction and quotient construction modulo deterministic nonconstant dense moduli over F65537.
        - name: quotient-arithmetic
          description: Canonical quotient representatives for addition, multiplication, negation, subtraction, exponentiation, scalar multiplication, and natural casts.
  HexGFqField:
    deps: [HexGFqRing, HexBerlekamp]
    mathlib: false
    done_through: 4
    status: active
    phase4:
      comparators:
        - tool: FLINT fq_default via python-flint
          class: informational
          rationale: "FLINT's fq_default finite-field arithmetic is a tuned C implementation over irreducible polynomial quotient fields; HexGFqField is the verified field wrapper over HexGFqRing with Rabin-checked irreducible moduli. The ratio is recorded for orientation but is not a Phase-4 gate. Wired via the shared persistent-subprocess python-flint driver (`scripts/oracle/flint_bench_driver.py`) per SPEC/benchmarking.md §External comparators §Process call."
      input_families:
        - name: dense-canonical-reduction
          description: Field construction from a dense polynomial through quotient-ring reduction modulo Rabin-checked irreducible moduli over F7.
        - name: field-arithmetic
          description: Canonical field representatives over F7 quotients for addition, multiplication, negation, and subtraction.
        - name: field-exponentiation
          description: Square-and-multiply natural, signed, and Frobenius p-th powers on canonical field representatives over F7 quotients.
        - name: field-inversion-division
