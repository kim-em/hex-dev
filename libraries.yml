          class: gating
          goal: "Lean BZ must stay within a small constant of the verified Isabelle BZ on small/medium-r inputs handled by the classical tier, and must strictly beat the verified classical Isabelle BZ on the large-r lattice-backed tail before the Phase-4 external-comparator goal is considered met. The Phase-4 report must record scheduled-hardware evidence across the seam, including the last classical Swinnerton-Dyer rung and the first lattice-backed Swinnerton-Dyer rung; if the verified classical reference times out at the declared cap, record solved-under-cap versus timeout rather than a finite ratio. Algorithm-class caveat per HexBerlekampZassenhaus/SPEC/hex-berlekamp-zassenhaus.md §External comparators: Isabelle's classical exhaustive recombination is weaker asymptotically than hex's BHKS van Hoeij CLD, so the large-r goal is to demonstrate that asymptotic advantage in wall-clock, not merely match the reference."
