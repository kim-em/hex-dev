  # ---------- Factoring pipeline ----------
  HexBerlekamp:
    deps: [HexPolyFp, HexMatrix, HexRowReduce, HexGFqRing, HexBasic]
    mathlib: false
    done_through: 7
    status: active
    phase4:
      comparators:
        - tool: "FLINT nmod_poly.is_irreducible via python-flint"
          class: informational
          rationale: "FLINT's nmod_poly irreducibility test runs hand-tuned C word-level kernels (nmod arithmetic with precomputed inverses, tuned modular composition) against which Hex's verified Rabin test over generic FpPoly arithmetic pays a structural constant-factor cost, measured at 10x-373x across the eligible ladder (hex-berlekamp-rabin-compare-f396965d-chungus2.json, paired steady-state medians with the warmed persistent driver). The gap is structural, not a harness artefact and not an algorithm-class difference the library intends to close; the ratio is recorded for orientation and does not gate Phase 4. Wired via the shared persistent-subprocess python-flint driver per SPEC/benchmarking.md §External comparators §Process call."
        - tool: "FLINT nmod_poly.factor_distinct_deg via python-flint"
          class: informational
          rationale: "FLINT's distinct-degree factorization runs the same hand-tuned C kernels with tuned Frobenius/modular-composition strategies; Hex's verified DDF over generic FpPoly arithmetic pays a structural constant-factor cost, measured at 44x-749x across the eligible ladder (hex-berlekamp-ddf-compare-f396965d-chungus2.json, paired steady-state medians with the warmed persistent driver). The gap is structural; the ratio is recorded for orientation and does not gate Phase 4. Wired via the shared persistent-subprocess python-flint driver per SPEC/benchmarking.md §External comparators §Process call."
      input_families:
        - name: berlekamp-matrix
          description: Deterministic dense monic F_5 polynomials for Berlekamp Frobenius-matrix construction.
        - name: rabin-irreducibility
          description: Deterministic dense monic F_5 polynomials for Rabin irreducibility testing.
        - name: split-step-factorization
          description: Fibonacci-style F_5 polynomial pairs exercising quadratic Euclidean gcd work in Berlekamp split candidates.
        - name: distinct-degree-factorization
          description: Deterministic dense monic F_5 polynomials with mixed low-degree factor structure for distinct-degree factorization.
  HexHensel:
